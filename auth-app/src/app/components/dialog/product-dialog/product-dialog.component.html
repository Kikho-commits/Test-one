<h2 mat-dialog-title>{{ data.product ? 'Update Product' : 'Add Product' }}</h2>
<mat-dialog-content>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" style="margin-top: 5px;">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="productName" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Price (₹/qty)</mat-label>
      <input matInput type="number" formControlName="price" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Supplier Name</mat-label>
      <input matInput formControlName="supplierName" required />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="productForm.invalid">
    {{ data.product ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
