<mat-card class="card">
    <mat-card-header>
        <mat-card-title class="text-center">Reset Password</mat-card-title>
    </mat-card-header>
    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" required>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Current Password</mat-label>
            <input matInput type="password" formControlName="currentPassword" required>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>New Password</mat-label>
            <input matInput type="password" formControlName="newPassword" required>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirm Password</mat-label>
            <input matInput type="password" formControlName="confirmPassword" required>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="!isPasswordMatch() || resetForm.invalid">
            Reset
        </button>
    </form>
</mat-card>
